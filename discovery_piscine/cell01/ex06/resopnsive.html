<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
        }
        td {
            width: 50%;
            padding: 10px;
        }
        .cell1 {
            background-color: #bada55;
            text-align: center;
        }
        .cell2 {
            background-color: #ffc0cb;
            text-align: center;
        }
    </style>
</head>
<body>

    <table border="1">
        <tr>
            <td class="cell1">First cell</td>
            <td class="cell2">Second cell</td>
        </tr>
    </table>

</body>
</html>
