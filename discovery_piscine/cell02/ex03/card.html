<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <h1>User Profile Card</h1>

    <table class="profile-card">
        <tr>
            <td class="image-cell">
                <img src="IMG_0460.jpg" alt="Profile Picture" class="profile-img">
            </td>
        </tr>
        <tr>
            <td class="login">tpanthap</td>
        </tr>
        <tr>
            <td class="description">young dumb&broke</td>
        </tr>
        <tr>
            <td class="location">KMITL</td>
        </tr>
        <tr>
            <td class="socials">
                <img src="image.png" alt="Website" class="social-icon">
                <img src="IMG_7046.png" alt="Twitter" class="social-icon">
                <img src="image0.jpg" alt="LinkedIn" class="social-icon">
                <img src="IMG_0460.jpg" alt="Facebook" class="social-icon">
            </td>
        </tr>
        <tr>
            <td class="button-cell">
                <button class="contact-btn" onclick="alert('Contact clicked')">Contact</button>
            </td>
        </tr>
    </table>

</body>
</html>
